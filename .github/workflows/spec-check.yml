name: Check Spec Updates

on:
  schedule:
    # Every day at 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Check contracts
        id: check
        run: |
          python scripts/check_spec_updates.py --json > /tmp/report.json || true
          cat /tmp/report.json
          echo "report<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/report.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open("/tmp/report.json"))
          print("has_updates=%s" % ("true" if r.get("has_updates") else "false"))
          EOF

      - name: Open or update the issue
        if: steps.check.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            const report = JSON.parse(process.env.REPORT);
            const changes = report.changes || [];
            if (!changes.length) return;

            const label = "spec-update";
            const table = changes
              .map(c => `| \`${c.contract}\` | ${c.status} | ${c.detail} | ${c.modules.slice(0,3).join(", ")} |`)
              .join("\n");

            const body = [
              "## Amazon Ads API contract updates detected",
              "",
              `${changes.length} contract(s) differ from the version recorded in \`specs/\`.`,
              "",
              "| Contract | Status | Detail | Used by |",
              "|---|---|---|---|",
              table,
              "",
              "### What to do",
              "",
              "1. Download the new contract and replace the one in `specs/`.",
              "2. Update its `sha256` and `size` in `specs/contracts.json`.",
              "3. Diff both versions and check whether the modules under `ad_api/` still match.",
              "4. Commit. The next run will be quiet until the contract changes again.",
              "",
              "The hash is only updated by a commit. This issue does not repost the same",
              "warning every day, unlike a check that compares against a stale file.",
              "",
              "*Generated by check_spec_updates.py*",
            ].join("\n");

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });

            if (open.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto] Amazon Ads API contract updates (${changes.length})`,
              body,
              labels: [label],
            });
