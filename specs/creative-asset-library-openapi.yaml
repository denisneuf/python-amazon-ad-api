info:
  title: Creative assets
  version: '3.0'
  description: |-
    Use the creative assets API to create and manage video and image assets for use in Amazon Ads campaigns. For details on using this API, see [Creatives overview](guides/creative-asset/asset-library-overview).
paths:
  /assets:
    get:
      summary: Retrieve an asset
      operationId: getAsset
      responses:
        '200':
          description: Returns asset metadata.
          content:
            application/vnd.creativeassetsgetresponse.v3+json:
              schema:
                type: object
                properties:
                  assetVersionList:
                    $ref: '#/components/schemas/caAssetVersionList'
                  assetGlobal:
                    $ref: '#/components/schemas/caAssetGlobal'
        '400':
          description: Bad Request
          content:
            application/vnd.creativeassetsgetresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caBadRequest'
        '401':
          description: UnAuthorized Operation
          content:
            application/vnd.creativeassetsgetresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caUnauthorizedRequest'
        '403':
          description: Forbidden Operation
          content:
            application/vnd.creativeassetsgetresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caForbiddenRequest'
        '500':
          description: Internal Server Error
          content:
            application/vnd.creativeassetsgetresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caInternalError'
      parameters:
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-ClientId
          description: The identifier of a client associated with a "Login with Amazon" account.
          required: true
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-Scope
          description: The identifier of a profile associated with the advertiser account. Use `GET` method on Profiles resource to list profiles associated with the access token passed in the HTTP Authorization header.
          required: true
        - schema:
            type: string
          in: query
          name: assetId
          description: The assetId
          required: true
        - schema:
            type: string
          in: query
          name: version
          description: The versionId of the asset, if not included all versions will return.
          required: false
      tags:
        - Creative assets
  /assets/batchRegister/{requestId}:
    get:
      summary: Retrieves status of the batch asset registration request, uniquely identified by requestId.
      operationId: getAssetsBatchRegister
      responses:
        '200':
          description: Registration status of each media file( uniquely identified by their url).
          content:
            application/vnd.creativeassetsgetbatchregisterresponse.v3+json:
              schema:
                title: GetBatchRegisterAssetStatusOutput
                type: object
                properties:
                  registrationStatus:
                    $ref: '#/components/schemas/caRegistrationStatus'
                  successfullyRegisteredAssets:
                    $ref: '#/components/schemas/caSuccessfulRegistrationDetailsList'
                  inProgressAssetDetails:
                    $ref: '#/components/schemas/caInProgressRegistrationDetailsList'
                  failedAssetDetails:
                    $ref: '#/components/schemas/caFailedRegistrationDetailsList'
        '400':
          description: Bad Request
          content:
            application/vnd.creativeassetsgetbatchregisterresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caBadRequest'
        '401':
          description: UnAuthorized Operation
          content:
            application/vnd.creativeassetsgetbatchregisterresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caUnauthorizedRequest'
        '403':
          description: Forbidden Operation
          content:
            application/vnd.creativeassetsgetbatchregisterresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caForbiddenRequest'
        '429':
          description: Operation Throttled.
          content:
            application/vnd.assetsbatchregisterresponse.v1+json:
              schema:
                $ref: '#/components/schemas/caThrottledRequest'
        '500':
          description: Internal Server Error
          content:
            application/vnd.creativeassetsgetbatchregisterresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caInternalError'
      parameters:
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-ClientId
          description: The identifier of a client associated with a "Login with Amazon" account.
          required: true
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-Scope
          description: The identifier of a profile associated with the advertiser account. Use `GET` method on Profiles resource to list profiles associated with the access token passed in the HTTP Authorization header.
          required: true
        - schema:
            type: string
          in: path
          name: requestId
          description: Batch asset registration request id. It is returned in response of POST /assets/batchRegister API.
          required: true
      tags:
        - Creative assets
  /assets/batchRegister:
    post:
      tags:
        - Creative assets
      summary: Batch register uploaded assets
      description: This is an asynchronous api that provides clients an identifier for their batch registration request. They need to check for the status of their request by calling the `GET /assets/batchRegister/{requestId}` api with the identifier.
      operationId: assetsBatchRegister
      parameters:
        - name: Amazon-Advertising-API-ClientId
          in: header
          description: "The identifier of a client associated with a `Login with Amazon` account."
          required: true
          schema:
            type: string
        - name: Amazon-Advertising-API-Scope
          in: header
          description: The identifier of a profile associated with the advertiser account. Use `GET` method on Profiles resource to list profiles associated with the access token passed in the HTTP Authorization header and choose profile id `profileId` from the response to pass it as input.
          required: true
          schema:
            type: string
      requestBody:
        description: Batch Register Uploaded Assets.
        content:
          application/vnd.assetsbatchregisterrequest.v1+json:
            schema:
              title: AssetsBatchRegisterRequest
              type: object
              properties:
                assetDetailsList:
                  maxItems: 50
                  minItems: 1
                  type: array
                  description: List containing details of assets to register.
                  items:
                    type: object
                    properties:
                      asinList:
                        $ref: "#/components/schemas/caAsins"
                      assetSubTypeList:
                        $ref: "#/components/schemas/caAssetSubTypes"
                      assetType:
                        $ref: "#/components/schemas/caAssetType"
                      associatedPrograms:
                        maxItems: 100
                        minItems: 1
                        type: array
                        items:
                          $ref: "#/components/schemas/caAssociatedProgram"
                      name:
                        $ref: "#/components/schemas/caAssetName"
                      otherMetadata:
                        type: object
                        additionalProperties:
                          type: string
                        description: Any other metadata that client wants to associate with this asset.
                      skipAssetSubTypesDetection:
                        type: boolean
                        description: Flag to determine if asset subtype detection should be skipped.
                      tagList:
                        $ref: "#/components/schemas/caTagList"
                      url:
                        type: string
                        description: Url of the media file to be registered as an asset.
                      versionInfo:
                        $ref: "#/components/schemas/caVersionInfo"
                    description: Object containing details for individual assets to register.
                batchRegistrationContext:
                  $ref: "#/components/schemas/caBatchRegistrationContext"
        required: true
      responses:
        "200":
          description: Identifier for the batch registration request.
          content:
            application/vnd.assetsbatchregisterresponse.v1+json:
              schema:
                title: BatchRegisterAssetResponse
                type: object
                properties:
                  requestId:
                    type: string
        "400":
          description: Bad Request.
          content:
            application/vnd.assetsbatchregisterresponse.v1+json:
              schema:
                $ref: "#/components/schemas/caBadRequest"
        "401":
          description: UnAuthorized Operation.
          content:
            application/vnd.assetsbatchregisterresponse.v1+json:
              schema:
                $ref: "#/components/schemas/caUnauthorizedRequest"
        "403":
          description: Forbidden Operation.
          content:
            application/vnd.assetsbatchregisterresponse.v1+json:
              schema:
                $ref: "#/components/schemas/caForbiddenRequest"
        "429":
          description: Operation Throttled.
          content:
            application/vnd.assetsbatchregisterresponse.v1+json:
              schema:
                $ref: "#/components/schemas/caThrottledRequest"
        "500":
          description: Internal Server Error.
          content:
            application/vnd.assetsbatchregisterresponse.v1+json:
              schema:
                $ref: "#/components/schemas/caInternalError"
  /assets/register:
    post:
      summary: Register an uploaded asset
      x-amazon-advertising-authorization:
        permissions:
          - amazon_stores_edit
          - advertiser_campaign_edit
          - creatives_edit
          - creatives_view
          - campaign_view
          - campaign_edit
        rules:
          - resourceType: DSP_ACCOUNT
            resourceLocation:
              parameterName: Amazon-Ads-AccountId
              in: header
            allowFallback: 'true'
      requestBody:
        description: Note - **asinList**, **versionInfo**, and **tags** are optional in the request body.
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  $ref: '#/components/schemas/caAssetUploadLocation'
                name:
                  $ref: '#/components/schemas/caAssetName'
                asinList:
                  $ref: '#/components/schemas/caAsins'
                assetType:
                  $ref: '#/components/schemas/caAssetType'
                assetSubTypeList:
                  $ref: '#/components/schemas/caassetSubTypes'
                versionInfo:
                  $ref: '#/components/schemas/caVersionInfo'
                tags:
                  type: array
                  items:
                    type: string
                registrationContext:
                  $ref: '#/components/schemas/caRegistrationContext'
                associatedSubEntityList:
                  $ref: '#/components/schemas/caAssociatedSubEntityList'
                skipAssetSubTypesDetection:
                  description: Select true if you want to set an asset to a specific assetSubType, if this is not included the system may reclassify your asset based on specifications.
                  type: boolean
        required: true
      description: |-
        The API should be called once the asset is uploaded to the location
        provided by the /asset/upload API endpoint. See [Creating assets](guides/creative-asset/creating-assets) to understand the call flow.
      operationId: registerAsset
      responses:
        '200':
          description: AssetResource
          content:
            application/vnd.creativeassetsregisterresponse.v3+json:
              schema:
                type: object
                properties:
                  assetId:
                    $ref: '#/components/schemas/caAssetId'
                  versionId:
                    $ref: '#/components/schemas/caVersion'
                  failedSpecChecks:
                    $ref: '#/components/schemas/caProgramSpecificationsList'
        '400':
          description: Bad Request
          content:
            application/vnd.creativeassetsregisterresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caBadRequest'
        '401':
          description: UnAuthorized Operation
          content:
            application/vnd.creativeassetsregisterresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caUnauthorizedRequest'
        '403':
          description: UnAuthorized Operation
          content:
            application/vnd.creativeassetsregisterresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caForbiddenRequest'
        '404':
          description: Resource not found
          content:
            application/vnd.creativeassetsregisterresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caResourceNotFound'
        '500':
          description: Internal Server Error
          content:
            application/vnd.creativeassetsregisterresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caInternalError'
      parameters:
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-ClientId
          description: The identifier of a client associated with a "Login with Amazon" account.
          required: true
        - schema:
            type: string
          in: header
          name: Amazon-Ads-AccountId
          description: Account identifier you use to access the DSP. This is your Amazon DSP Advertiser ID. Use Amazon-Ads-AccountId to get resources at advertiser level. Use Amazon-Advertising-API-Scope and leave     Amazon-Ads-AccountId empty to get resources at manager account level.
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-Scope
          description: The identifier of a profile associated with the advertiser account. Use `GET` method on Profiles resource to list profiles associated with the access token passed in the HTTP Authorization header.
      tags:
        - Creative assets
  /assets/upload:
    post:
      summary: Create an upload location
      x-amazon-advertising-authorization:
        permissions:
          - amazon_stores_edit
          - advertiser_campaign_edit
          - creatives_edit
          - creatives_view
          - campaign_view
          - campaign_edit
        rules:
          - resourceType: DSP_ACCOUNT
            resourceLocation:
              parameterName: Amazon-Ads-AccountId
              in: header
            allowFallback: 'true'
      requestBody:
        description: Make sure to include file extension along with filename . (ie. "filename.mp4") 
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  $ref: '#/components/schemas/caFileName'
        required: true
      description: Creates an ephemeral resource (upload location) to upload Assets to Creative Assets tool. The upload location is short lived and expires in 15 minutes.The upload location only supports PUT HTTP Method to upload the asset content. If the upload location expires, API user will get `403` Forbidden response.
      
        * All ad specs - sizes and policies can be found [here](https://advertising.amazon.com/resources/ad-specs/?ref_=a20m_us_hnav_spcs)
        
        
        * Program specific links
        
        1. **Stores** - [here](https://advertising.amazon.com/resources/ad-specs/stores?ref_=a20m_us_spcs_stcrgd)
        
        2. **SB/SBV/sponsored ads** - [here](https://advertising.amazon.com/resources/ad-policy/sponsored-ads-policies?ref_=a20m_us_spcs_sbv_spcs_spadcap)

        See [Creating assets](guides/creative-asset/creating-assets) to understand the call flow.
      operationId: getUploadLocation
      responses:
        '200':
          description: Returns an upload location.
          content:
            application/vnd.creativeassetsuploadresponse.v3+json:
              schema:
                type: object
                properties:
                  url:
                    $ref: '#/components/schemas/caAssetUploadLocation'
        '400':
          description: Bad Request
          content:
            application/vnd.creativeassetsuploadresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caBadRequest'
        '401':
          description: UnAuthorized Operation
          content:
            application/vnd.creativeassetsuploadresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caUnauthorizedRequest'
        '403':
          description: Forbidden Operation
          content:
            application/vnd.creativeassetsuploadresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caForbiddenRequest'
        '500':
          description: Internal Server Error
          content:
            application/vnd.creativeassetsuploadresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caInternalError'
      tags:
        - Creative assets
      parameters:
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-ClientId
          description: The identifier of a client associated with a "Login with Amazon" account.
          required: true
        - schema:
            type: string
          in: header
          name: Amazon-Ads-AccountId
          description: Account identifier you use to access the DSP. This is your Amazon DSP Advertiser ID. Use Amazon-Ads-AccountId to get resources at advertiser level. Use Amazon-Advertising-API-Scope and leave     Amazon-Ads-AccountId empty to get resources at manager account level.
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-Scope
          description: The identifier of a profile associated with the advertiser account. Use `GET` method on Profiles resource to list profiles associated with the access token passed in the HTTP Authorization header.
  /assets/search:
    post:
      summary: Search assets
      requestBody:
        description: |
          text - optional, this field matches asset name, asset name prefix, tags and ASINs associated with the assets
          
          filterCriteria - optional, this is used to filter results
          
          sortCriteria - optional, this is used to get sorted results
          
          pageCriteria - optional, this is used for pagination
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/caSearchRequestCommon'

        required: true
      operationId: searchAssets
      responses:
        '200':
          description: Returns search results
          content:
            application/vnd.creativeassetssearchassetsresponse.v3+json:
              schema:
                type: object
                properties:
                  totalRecords:
                    format: int64
                    type: integer
                  assetList:
                    type: array
                    items:
                      $ref: '#/components/schemas/caAsset'
                  token:
                    type: string
        '400':
          description: Bad Request
          content:
            application/vnd.creativeassetssearchassetsresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caBadRequest'
        '401':
          description: UnAuthorized Operation
          content:
            application/vnd.creativeassetssearchassetsresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caUnauthorizedRequest'
        '403':
          description: Forbidden Operation
          content:
            application/vnd.creativeassetssearchassetsresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caForbiddenRequest'
        '500':
          description: Internal Server Error
          content:
            application/vnd.creativeassetssearchassetsresponse.v3+json:
              schema:
                $ref: '#/components/schemas/caInternalError'
      parameters:
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-ClientId
          description: The identifier of a client associated with a "Login with Amazon" account.
          required: true
        - schema:
            type: string
          in: header
          name: Amazon-Advertising-API-Scope
          description: The identifier of a profile associated with the advertiser account. Use `GET` method on Profiles resource to list profiles associated with the access token passed in the HTTP Authorization header.
          required: true
      tags:
        - Creative assets
components:
  headers: {}
  examples: {}
  schemas:
    caAssociatedProgram:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/caMetadataMap'
        programName:
          $ref: '#/components/schemas/caProgram'
    caMetadataMap:
      description: Include key-value pairs related to the asset. For DSP use "dspAdvertiserId" = "ID". Include program as AMAZON_DSP.
      additionalProperties:
        type: string
      type: object
      example:
          "dspAdvertiserId": "string"
    caProgram:
      type: string
      description: Use this field to specify which program you are uploading an asset for. Currently, the accepted value here on registration is to associate an asset with a DSP advertiser.
      enum:
        - A_PLUS
        - INTEGRATED_VIDEO_EXPERIENCE
        - SB
        - POSTS
        - STORES
        - SPONSORED_BRANDS_VIDEO
        - SPONSORED_DISPLAY_VIDEO
        - AMAZON_DSP
        - FIRE_TV
        - SPONSORED_TV
        - PRODUCT_DESCRIPTION_PAGE
    caFileName:
      pattern: '[\w]+\.jpg|png|mp4|mov|wmv|avi'
      description: The fileName of the asset.
      type: "string" 
    caAsins:
      minItems: 1
      maxItems: 100
      description: Tagging assets with ASIN, promotes asset discoverability downstream. If ASIN is provided at the time of upload/during asset registration, it is applied as a tag on that asset. This allows for that asset to be searchable using that ASIN#. For e.g., An advertiser may want to search for assets tagged with ASIN BC10001, so they can create a store spotlight ad with product images for that ASIN.
      type: array
      items:
        type: string
    caAssetVersionList:
      minItems: 1
      maxItems: 100
      description: The asset version list.
      type: array
      items:
        $ref: '#/components/schemas/caAssetVersion'
    caSpecification:
      description: |-
        Structure containing specification
         stringId: This is the translated string Id, client will be retrieving the translation corresponding to this string.
         failureReason: This specifies the failure reason of specification. 
         arguments: Arguments required for translation string.
         isPassed: Whether spec got passed or failed.
         actualValue: If spec got failed then this attribute represent the actual value of the spec parameter in the file.
      type: object
      properties:
        stringId:
          type: string
        isPassed:
          type: boolean
        failureReason:
          type: string
        actualValue:
          type: string
        arguments:
          $ref: '#/components/schemas/caArgumentList'
    caArgumentList:
      description: List of arguments for translation string
      type: array
      items:
        type: string
    caPageCriteria:
      description: |
        used for pagination

        when searching for the first page, no need to put anything, otherwise, use the token returned from previous search call
      type: object
      properties:
        identifier:
          $ref: '#/components/schemas/caPageIdentifier'
        size:
          $ref: '#/components/schemas/caPageSize'
    caProgramSpecifications:
      description: Specification Check for program, This contains program name and specifications
      type: object
      properties:
        specProgramName:
          $ref: '#/components/schemas/caSpecificationProgram'
        specifications:
          $ref: '#/components/schemas/caSpecificationList'
    caSpecificationList:
      description: List of specifications
      type: array
      items:
        $ref: '#/components/schemas/caSpecification'
    caProgramSpecificationsList:
      description: Specification Checks for all programs
      type: array
      items:
        $ref: '#/components/schemas/caProgramSpecifications'
    caAssetVersion:
      type: object
      properties:
        lastUpdatedBy:
          type: string
        creationTime:
          format: int64
          type: integer
        specCheckApprovedPrograms:
          $ref: '#/components/schemas/caSpecCheckApprovedPrograms'
        assetIdentifier:
          $ref: '#/components/schemas/caAssetIdentifier'
        assetFiles:
          $ref: '#/components/schemas/caAssetFiles'
        otherMetadata:
          $ref: '#/components/schemas/caMetadataMap'
        url:
          $ref: '#/components/schemas/caURL'
        assetSubTypes:
          $ref: '#/components/schemas/caassetSubTypes'
        fileMetadata:
          $ref: '#/components/schemas/caFileMetadata'
        createdBy:
          type: string
        name:
          $ref: '#/components/schemas/caFileName'
        lastUpdatedTime:
          format: int64
          type: integer
        versionNotes:
          description: The URL of the asset
          type: string
        assetStatus:
          $ref: '#/components/schemas/caAssetStatus'
        failedSpecChecks:
          $ref: '#/components/schemas/caProgramSpecificationsList'
        storageLocationUrls:
          $ref: '#/components/schemas/caStorageLocationUrls'
        moderationContentList:
          type: array
          items:
            $ref: '#/components/schemas/caModerationContent'
    caURL:
      description: The URL of the asset.
      type: string
    caModerationPolicyMap:
      description: 'A hashmap of key-value pairs, this is the most accurate way of defining a map in swagger 2.0'
      type: object
      example:
        HSA: REJECTED
        Stores: PENDING
        Logo: APPROVED
    caUnauthorizedRequest:
      description: 401 unauthorized request
      type: object
      properties:
        message:
          type: string
    caAssetSubType:
      type: string
      enum:
        - LOGO
        - PRODUCT_IMAGE
        - AUTHOR_IMAGE
        - LIFESTYLE_IMAGE
        - OTHER_IMAGE
        - BACKGROUND_VIDEO
    caAssetGlobal:
      type: object
      properties:
        assetId:
          $ref: '#/components/schemas/caAssetId'
        assetType:
          $ref: '#/components/schemas/caAssetType'
        accountIds:
          $ref: "#/components/schemas/caAccounts"
        marketplaceId:
          $ref: "#/components/schemas/caMarketplaceIds"
    caValueFilter:
      description: Filter for certain values of asset attributes
      type: object
      properties:
        values:
          type: array
          items:
            type: string
        valueField:
          type: string
          enum:
            - TAG
            - ASIN
            - CAMPAIGN_NAME
            - CAMPAIGN_ID
            - PROGRAM
            - ASSET_TYPE
            - ASSET_SUB_TYPE
            - APPROVED_AD_POLICY
            - ASSET_EXTENSION
    caSpecCheckApprovedPrograms:
      description: List of spec programs for which asset spec check is approved
      type: array
      items:
        $ref: '#/components/schemas/caSpecificationProgram'
    caSpecificationProgram:
      type: string
      enum:
        - SPONSORED_BRANDS_VIDEO
        - SPONSORED_DISPLAY_VIDEO
        - SPONSORED_DISPLAY_LANDSCAPE_VIDEO
        - SPONSORED_DISPLAY_PORTRAIT_VIDEO
        - SPONSORED_DISPLAY_SQUARE_VIDEO
        - STORES_VIDEO_TILE
        - STORES_BACKGROUND_VIDEO_TILE
        - STORES_INTRO_SPLASH
        - FIRE_TV_FEATURE_ROTATOR
        - SPONSORED_TV
        - SPONSORED_BRANDS_VIDEO_PORTRAIT
        - DEMAND_SIDE_PLATFORM_OTT
        - DEMAND_SIDE_PLATFORM_OLV
        - DEMAND_SIDE_PLATFORM_H1_DESKTOP
        - DEMAND_SIDE_PLATFORM_H1_MOBILE
        - LIVE_IMAGE_SPONSORED_DISPLAY
    caAsset:
      type: object
      properties:
        moderationPolicyMap:
          $ref: '#/components/schemas/caModerationPolicyMap'
        lastUpdatedBy:
          type: string
        creationTime:
          format: int64
          type: integer
        specCheckApprovedPrograms:
          $ref: '#/components/schemas/caSpecCheckApprovedPrograms'
        associatedAccountIds:
          type: array
          items:
            type: string
        marketplaces:
          type: array
          items:
            type: string
        version:
          type: string
        tags:
          type: array
          items:
            type: string
        assetType:
          $ref: '#/components/schemas/caAssetType'
        fileMetadata:
          $ref: '#/components/schemas/caFileMetadata'
        collections:
          type: array
          items:
            type: string
        createdBy:
          type: string
        assetId:
          type: string
        storageLocationUrls:
          $ref: '#/components/schemas/caStorageLocationUrls'
        name:
          type: string
        lastUpdatedTime:
          format: int64
          type: integer
        associatedContexts:
          $ref: '#/components/schemas/caAssociatedContextTypeMapping'
        assetSubTypes:
          type: array
          items:
            $ref: '#/components/schemas/caAssetSubType'
        status:
          $ref: '#/components/schemas/caAssetStatus'
    caAssetStatus:
      type: string
      enum:
        - ACTIVE
        - PROCESSING
        - ARCHIVED
    caRangeFilter:
      description: |
        Filter assets which have certain ranges of asset attributes.
        
        For example, filter assets which have file size in the range of [10,20] or [40,50].
      type: object
      properties:
        rangeField:
          $ref: '#/components/schemas/caValueRangeFilterOptions'
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/caRange'
    caAssetSortCriteria:
      type: object
      properties:
        field:
          type: string
          enum:
            - CREATED_TIME
            - SIZE
            - NAME
            - IMAGE_HEIGHT
            - IMAGE_WIDTH
            - EXTENSION
        order:
          type: string
          enum:
            - ASC
            - DESC
    caSearchAssetText:
      description: The text used for searching assets, it matches asset name, asset name prefix, tags and ASINs associated with the assets
      type: string
    caAssetUploadLocation:
      description: The url to upload the asset. The url expires in 15 minutes.
      type: string
    caAssetName:
      description: The name to be given to the asset being registered.
      type: string
    caResourceNotFound:
      description: 404 requested resource not found
      type: object
      properties:
        message:
          type: string
    caFileMetadata:
      type: object
      properties:
        duration:
          format: double
          type: number
        extension:
          description: The extension of the file name.
          type: string
        fileSize:
          description: The asset size in bytes.
          type: number
        resolutionHeight:
          type: integer
        width:
          description: The width of the asset in pixels.
          type: number
        aspectRatio:
          pattern: '[0-9]+:[0-9]+'
          description: The aspect ration of the asset.
          type: string
        resolutionWidth:
          type: integer
        contentType:
          description: The content type of the asset.
          type: string
          enum:
            - jpeg
            - jpg
            - png
            - mp4
            - image/jpg
            - image/jpeg
            - image/png
        audioSampleRate:
          format: double
          type: number
        height:
          description: The height of the asset in pixels.
          type: number
    caAssetId:
      description: The asset identifier.
      type: string
    caAssetType:
      description: The asset type you are registering [`IMAGE`, `VIDEO`]
      type: string
      enum:
        - IMAGE
        - VIDEO
    caInternalError:
      description: 500 internal server error
      type: object
      properties:
        message:
          type: string
    caAccounts:
      description: The list of advertiser accounts the asset can be shared with. All the accounts within this list will be able to search this asset. Additional validation of checking that the accounts are associated will be done as part of this call.
      type: array
      minItems: 1
      maxItems: 100
      items: 
        type: string
    caMarketplaceIds:
      description: The list of marketplace Ids.
      type: array
      minItems: 1
      maxItems: 100
      items: 
        type: string
    caAssetIdentifier:
      type: object
      properties:
        assetId:
          $ref: '#/components/schemas/caAssetId'
        version:
          $ref: '#/components/schemas/caVersion'
    caModerationContent:
      type: object
      properties:
        assetSubType:
          $ref: '#/components/schemas/caAssetSubType'
        adPolicyModerationResultList:
          minItems: 1
          maxItems: 10
          type: array
          items:
            $ref: '#/components/schemas/caAdPolicyModerationResult'
        moderationContentStatus:
          $ref: '#/components/schemas/caModerationContentStatus'
    caModerationStatus:
      type: string
      enum:
        - REJECTED
        - APPROVED
        - PENDING
    caModerationContentStatus:
      type: string
      enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
    caRange:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
    caForbiddenRequest:
      description: 403 forbidden request
      type: object
      properties:
        message:
          type: string
    caAdPolicyModerationResult:
